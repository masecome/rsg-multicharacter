<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="fonts.css" rel="stylesheet">
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>RSG-Multicharacter</title>
</head>
<body>
    <div id="app" class="app is-hidden">
        <div class="scrim"></div>
        <div class="glow"></div>

        <!-- Yükleme ekranı -->
        <section class="loading">
            <div class="logo logo-lg"><span class="logo-a"></span><span class="logo-b"></span></div>
            <div class="loading-bar"><span></span></div>
            <p id="loading-text" class="loading-text"></p>
        </section>

        <!-- Üst bar -->
        <header class="topbar">
            <div class="logo"><span class="logo-a"></span><span class="logo-b"></span></div>
            <div class="topbar-pill"><span class="dot"></span><span data-lang="title"></span></div>
            <div class="topbar-count">
                <span data-lang="slots"></span>
                <strong id="slot-count">0 / 0</strong>
            </div>
        </header>

        <!-- Sol: başlık + karakter listesi -->
        <section class="left">
            <span class="kicker"><span class="dot"></span><span data-lang="kicker"></span></span>
            <h1 class="hero">
                <span data-lang="hero_1"></span>
                <span class="hero-red" data-lang="hero_2"></span>
            </h1>
            <p class="lead" data-lang="lead"></p>
            <ul id="slot-list" class="slot-list"></ul>
        </section>

        <!-- Sağ: karakter dosyası -->
        <aside class="card dossier">
            <div class="card-head">
                <span class="label" data-lang="dossier"></span>
                <span id="dossier-badge" class="badge"><span class="dot"></span><span></span></span>
            </div>
            <div id="dossier-body"></div>
            <div class="dossier-actions">
                <button id="btn-play" class="btn btn-primary" type="button">
                    <span id="btn-play-text"></span>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h11.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H5z"/></svg>
                </button>
                <button id="btn-delete" class="btn btn-ghost" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg>
                    <span data-lang="delete"></span>
                </button>
            </div>
        </aside>

        <!-- Alt: kısayollar -->
        <footer class="hints">
            <span><kbd>↑</kbd><kbd>↓</kbd><em data-lang="hint_select"></em></span>
            <span><kbd>ENTER</kbd><em data-lang="hint_confirm"></em></span>
            <span id="hint-delete"><kbd>DEL</kbd><em data-lang="hint_delete"></em></span>
        </footer>

        <!-- Onay pencereleri -->
        <div id="modal-backdrop" class="modal-backdrop"></div>

        <div id="modal-create" class="card modal" role="dialog">
            <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></div>
            <h3 data-lang="create_title"></h3>
            <p data-lang="create_text"></p>
            <div class="modal-buttons">
                <button class="btn btn-ghost" data-close type="button"><span data-lang="cancel"></span></button>
                <button id="confirm-create" class="btn btn-primary" type="button"><span data-lang="confirm"></span></button>
            </div>
        </div>

        <div id="modal-delete" class="card modal" role="dialog">
            <div class="modal-icon"><svg viewBox="0 0 24 24"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg></div>
            <h3 data-lang="delete_title"></h3>
            <p id="delete-text"></p>
            <div class="modal-buttons">
                <button class="btn btn-ghost" data-close type="button"><span data-lang="cancel"></span></button>
                <button id="confirm-delete" class="btn btn-primary btn-hold" type="button">
                    <span class="hold-fill"></span>
                    <span data-lang="hold_delete"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
