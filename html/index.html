<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="reset.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <title>RSG-Multicharacter</title>
</head>
<body>
    <div id="app" class="app is-hidden">
        <div class="vignette"></div>
        <div class="grain"></div>

        <!-- Yükleme ekranı -->
        <section id="loading" class="loading">
            <div class="loading-emblem">
                <svg viewBox="0 0 100 100" class="loading-ring" aria-hidden="true">
                    <circle cx="50" cy="50" r="44" class="ring-track"/>
                    <circle cx="50" cy="50" r="44" class="ring-fill"/>
                </svg>
                <svg viewBox="0 0 24 24" class="loading-star" aria-hidden="true">
                    <path d="M12 2l2.6 6.9H22l-6 4.6 2.3 7.2L12 16.3 5.7 20.7 8 13.5 2 8.9h7.4z"/>
                </svg>
            </div>
            <p id="loading-text" class="loading-text"></p>
        </section>

        <!-- Başlık -->
        <header class="brand">
            <span class="brand-kicker" data-lang="kicker"></span>
            <h1 class="brand-title" data-lang="title"></h1>
            <img class="brand-divider" src="assets/divider_line.png" alt="">
        </header>

        <!-- Sol panel: karakter listesi -->
        <aside class="panel roster">
            <div class="panel-header">
                <img src="assets/menu_header_1a.png" alt="" class="panel-header-frame">
                <h2 data-lang="characters"></h2>
            </div>
            <div class="roster-meta">
                <span data-lang="slots"></span>
                <span id="slot-count">0 / 0</span>
            </div>
            <ul id="slot-list" class="slot-list"></ul>
        </aside>

        <!-- Sağ panel: karakter bilgisi -->
        <aside id="dossier" class="panel dossier">
            <div id="dossier-body"></div>
        </aside>

        <!-- Alt aksiyon çubuğu -->
        <footer id="actions" class="actions">
            <div class="action-buttons">
                <button id="btn-delete" class="btn btn-ghost" type="button">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zm-3 6h12l-1 12H7z"/></svg>
                    <span data-lang="delete"></span>
                </button>
                <button id="btn-play" class="btn btn-primary" type="button">
                    <span id="btn-play-text"></span>
                </button>
            </div>
            <div class="key-hints">
                <span><kbd>↑</kbd><kbd>↓</kbd> <em data-lang="hint_select"></em></span>
                <span><kbd>ENTER</kbd> <em data-lang="hint_confirm"></em></span>
                <span id="hint-delete"><kbd>DEL</kbd> <em data-lang="hint_delete"></em></span>
            </div>
        </footer>

        <!-- Onay pencereleri -->
        <div id="modal-backdrop" class="modal-backdrop"></div>

        <div id="modal-create" class="modal" role="dialog">
            <h3 data-lang="create_title"></h3>
            <img class="modal-divider" src="assets/divider_line.png" alt="">
            <p data-lang="create_text"></p>
            <div class="modal-buttons">
                <button class="btn btn-ghost" data-close type="button"><span data-lang="cancel"></span></button>
                <button id="confirm-create" class="btn btn-primary" type="button"><span data-lang="confirm"></span></button>
            </div>
        </div>

        <div id="modal-delete" class="modal modal-danger" role="dialog">
            <h3 data-lang="delete_title"></h3>
            <img class="modal-divider" src="assets/divider_line.png" alt="">
            <p id="delete-text"></p>
            <div class="modal-buttons">
                <button class="btn btn-ghost" data-close type="button"><span data-lang="cancel"></span></button>
                <button id="confirm-delete" class="btn btn-danger btn-hold" type="button">
                    <span class="hold-fill"></span>
                    <span data-lang="hold_delete"></span>
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
